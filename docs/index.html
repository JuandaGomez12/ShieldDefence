<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShieldDefence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- Encabezado -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </span>
        <span class="brand-name">ShieldDefence</span>
      </div>
      <div class="top-actions">
        <button type="button" class="llm-toggle" id="llm-toggle" title="Descarga el LLM ajustado con LoRA (unos 400 MB, solo la primera vez) para que escriba la explicación">Activar explicación con IA</button>
        <span class="status loading" id="status"><i class="dot"></i><span id="status-text">Cargando modelo...</span></span>
      </div>
    </header>

    <!-- Zona de mensajes -->
    <main class="chat" id="chat">
      <section class="welcome" id="welcome">
        <h1>ShieldDefence</h1>
        <p id="greeting">Buena hora para empezar, ¿Qué quieres preguntar?</p>
        <p class="privacy">Todo se procesa en tu navegador: el correo no se envía a ningún servidor.</p>
      </section>
      <div class="messages" id="messages"></div>
    </main>

    <!-- Caja de entrada -->
    <footer class="composer">
      <form class="composer-box" id="form" autocomplete="off">
        <button type="button" class="attach" id="attach" aria-label="Subir pantallazo o PDF del correo" title="Subir pantallazo o PDF del correo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp,application/pdf" hidden />
        <div class="field">
          <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <textarea id="input" rows="1" placeholder="Pega aquí el correo que quieres revisar..." aria-label="Pega aquí el correo"></textarea>
        </div>
        <button type="submit" class="send" id="send" aria-label="Enviar" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
